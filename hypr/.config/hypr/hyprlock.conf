# Hyprlock configuration - Gruvbox Material Dark theme
# Matches Hyprland configuration style and colors

$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    animation = fadeIn, 1, 6, easeInOutCubic
    animation = fadeOut, 1, 6, easeInOutCubic
    animation = inputFieldDots, 1, 3, easeInOutCubic
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    blur_passes = 3
}

input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    inner_color = rgba(40, 40, 40, 0.7)

    outer_color = rgba(231, 138, 78, 0.8)     # Gruvbox Material orange (#e78a4e)
    check_color = rgba(169, 182, 101, 0.8)    # Gruvbox Material green (#a9b665)
    fail_color = rgba(234, 105, 98, 0.8)      # Gruvbox Material red (#ea6962)

    font_color = rgb(212, 190, 152)           # Gruvbox Material fg (#d4be98)
    fade_on_empty = false
    rounding = 8

    font_family = $font
    font_size = 14
    placeholder_text = Enter password...
    fail_text = Authentication failed

    dots_spacing = 0.3
    dots_center = true

    position = 0, -120
    halign = center
    valign = center
}

# Time display
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgb(212, 190, 152)                # Gruvbox Material fg (#d4be98)

    position = 0, 0
    halign = center
    valign = center
}

# Date display
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 24
    font_family = $font
    color = rgb(168, 153, 132)                # Gruvbox Material grey2 (#a89984)

    position = 0, -60
    halign = center
    valign = center
}
