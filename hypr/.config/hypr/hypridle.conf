# Hypridle — auto lock, screen off, suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Lock screen after 5 min idle (hyprlock directly: the
# loginctl lock-session -> lock_cmd chain does not fire on this machine)
listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

# Turn off screen 2 min after lock (7 min total idle)
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 min idle
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
