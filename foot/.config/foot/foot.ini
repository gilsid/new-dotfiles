# Switch theme by changing the include below. Themes live in themes/.

[main]
include=~/.config/foot/themes/gruvbox-material-dark.ini

font=JetBrainsMono Nerd Font Mono:size=11

# Without center, leftover pixels pile up at the bottom and right
# when the compositor forces a size that is not a cell multiple.
pad=0x0 center

initial-window-size-chars=110x32

# No client-side decorations.
[csd]
preferred=none

[scrollback]
lines=2000

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=no

# 0.0 is transparent, 1.0 is opaque.
[colors-dark]
alpha=0.75
