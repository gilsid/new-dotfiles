# -*- conf -*-
# Gruvbox Material Dark, material palette with medium background.
# Matches the alacritty, waybar, rofi and ghostty versions, except:
# regular0 is 32302f instead of 282828 so black stays visible,
# bright0 is 928374 instead of 7c6f64 so it stays readable,
# bright7 is ddc7a1 instead of d4be98 so it differs from normal white,
# selection follows alacritty instead of ghostty's inverse.
# Material orange e78a4e has no slot in the 16 color ANSI palette.

[colors-dark]
background=282828
foreground=d4be98

regular0=32302f
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98

bright0=928374
bright1=ea6962
bright2=a9b665
bright3=d8a657
bright4=7daea3
bright5=d3869b
bright6=89b482
bright7=ddc7a1

cursor=282828 d4be98

selection-foreground=d4be98
selection-background=665c54
