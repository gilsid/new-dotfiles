# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on' # auto-restore sessions on tmux start

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Navigate windows with Shift+Alt+h and Shift+Alt+l
bind -n M-H previous-window
bind -n M-L next-window

# Enable 24-bit color support (true-color for all terminals)
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:Tc"

# Set Catppuccin theme
set -g @catppuccin_flavour 'mocha' # or latte, frappe, macchiato

# Vi mode
set-window-option -g mode-keys vi

# Vim-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# XDG path (~/.config/tmux/plugins) for stow, ~/.tmux fallback for compatibility
run '~/.config/tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tpm/tpm'
