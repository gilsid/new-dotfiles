[general]
import = [
    "~/.config/alacritty/themes/gruvbox-material-dark.toml"
]

# ===============================
# FONT
# ===============================
[font]
size = 12.0
builtin_box_drawing = false

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

# ===============================
# WINDOW
# ===============================
[window]
decorations = "none"
opacity = 0.95  # Sedikit lebih solid biar teks tidak burem

[window.padding]
x = 0
y = 0

# ===============================
# SCROLLING
# ===============================
[scrolling]
history = 2000

# ===============================
# MOUSE
# ===============================
[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
